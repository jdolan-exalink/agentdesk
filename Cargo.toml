[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/identity",
    "crates/capture",
    "crates/transport",
    "crates/rmm",
    "crates/ai",
    "apps/server",
    "apps/server-console",
    "apps/agent-host",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2.6"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow"] }
egui = "0.31"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
lz4_flex = "0.11"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
snow = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "tls-rustls-ring-webpki"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tray-icon = "0.19"
urlencoding = "2.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

agentdesk-protocol = { path = "crates/protocol" }
agentdesk-identity = { path = "crates/identity" }
agentdesk-capture = { path = "crates/capture" }
agentdesk-transport = { path = "crates/transport" }
agentdesk-rmm = { path = "crates/rmm" }
agentdesk-ai = { path = "crates/ai" }
